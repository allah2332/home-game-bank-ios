# Builds the app on a GitHub Mac on every push: runs the engine tests, compiles the app for the
# iPhone simulator, then opens two screens with sample data and saves screenshots.
name: iOS build

on:
  push:
    branches-ignore: [ci-output]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Engine tests
        working-directory: Packages/PokerCore
        run: swift test 2>&1 | tee ../../core-tests.log

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build for simulator
        run: |
          set +e
          xcodebuild -project HomeGameBank.xcodeproj -scheme HomeGameBank -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build -clonedSourcePackagesDirPath spm \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > build.log 2>&1
          status=$?
          grep -E "error:|\*\* BUILD" build.log | head -150
          exit $status

      - name: Screenshots
        if: success()
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if x['name'].startswith('iPhone 16') and 'Pro' not in x['name'] and 'Plus' not in x['name']))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/Build/Products -name "HomeGameBank.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          shot() { NAME=$1; shift
            xcrun simctl launch "$DEVICE" com.saintspoker.gamebank -demo "$@"
            sleep 8
            xcrun simctl io "$DEVICE" screenshot "shots/$NAME.png"
            xcrun simctl terminate "$DEVICE" com.saintspoker.gamebank || true; }
          shot odds -tab odds
          shot odds-plo -tab odds -plo
          shot stats -tab stats
          shot stats-location -tab stats -view location
          shot home -tab home
          # Shared games against the real database: create a group, seat players, buy in.
          xcrun simctl launch "$DEVICE" com.saintspoker.gamebank -demo -clubtest -tab game
          sleep 60
          xcrun simctl io "$DEVICE" screenshot "shots/club-game.png"
          cp "$(xcrun simctl get_app_container "$DEVICE" com.saintspoker.gamebank data)/Documents/clubtest.txt" shots/ || true
          xcrun simctl terminate "$DEVICE" com.saintspoker.gamebank || true
          # Ads: launch with ads on and give the test ad time to load.
          xcrun simctl launch "$DEVICE" com.saintspoker.gamebank -demo -adcheck -tab odds
          sleep 25
          xcrun simctl io "$DEVICE" screenshot "shots/ad-on-open.png"
          xcrun simctl terminate "$DEVICE" com.saintspoker.gamebank || true

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            core-tests.log
            shots/
          if-no-files-found: ignore

      # Copies the screenshots and logs to the ci-output branch so they can be read with git.
      - name: Publish output branch
        if: always()
        run: |
          mkdir -p out
          cp -R shots out/ 2>/dev/null || true
          cp build.log core-tests.log out/ 2>/dev/null || true
          cd out
          git init -q -b ci-output
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-output
