# XcodeGen project definition. The build server runs `xcodegen generate` to make HomeGameBank.xcodeproj,
# so the project file never has to be edited by hand. On a Mac: `brew install xcodegen && xcodegen generate`.
name: HomeGameBank
options:
  bundleIdPrefix: com.saintspoker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PokerCore:
    path: Packages/PokerCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
  GoogleUMP:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: "2.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeGameBank:
    type: application
    platform: iOS
    sources:
      - path: HomeGameBank
    dependencies:
      - package: PokerCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUMP
        product: GoogleUserMessagingPlatform
    # Extra Info.plist keys (merged with the generated ones). Ad IDs: replace the test values below with
    # your own from AdMob (Apps > App settings, and Ad units) before the App Store build.
    info:
      path: HomeGameBank/Info.plist
      properties:
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdUnitAppOpen: $(ADMOB_APP_OPEN)
        AdUnitInterstitial: $(ADMOB_INTERSTITIAL)
        NSUserTrackingUsageDescription: Ads can be more relevant to you. The app stays free either way.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        # Change to your own reverse-domain ID before the first App Store upload.
        PRODUCT_BUNDLE_IDENTIFIER: com.saintspoker.gamebank
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Game Bank
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # Google's public test IDs until the AdMob account exists.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_APP_OPEN: ca-app-pub-3940256099942544/5575463023
        ADMOB_INTERSTITIAL: ca-app-pub-3940256099942544/4411468910
schemes:
  HomeGameBank:
    build:
      targets:
        HomeGameBank: all
    run:
      config: Debug
