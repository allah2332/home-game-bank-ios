# XcodeGen project definition. The build server runs `xcodegen generate` to make HomeGameBank.xcodeproj,
# so the project file never has to be edited by hand. On a Mac: `brew install xcodegen && xcodegen generate`.
name: HomeGameBank
options:
  bundleIdPrefix: com.saintspoker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PokerCore:
    path: Packages/PokerCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HomeGameBank:
    type: application
    platform: iOS
    sources:
      - path: HomeGameBank
    dependencies:
      - package: PokerCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        # Change to your own reverse-domain ID before the first App Store upload.
        PRODUCT_BUNDLE_IDENTIFIER: com.saintspoker.gamebank
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Game Bank
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "$(inherited) -ObjC"
schemes:
  HomeGameBank:
    build:
      targets:
        HomeGameBank: all
    run:
      config: Debug
